# Gitleaks Configuration — Chain Indexer
# Sanitized for public release
# Internal RMI rules live in standards/.gitleaks.toml (not shipped with OSS repos)

title = "Chain Indexer — Public Gitleaks Configuration"

# ─── CUSTOM RULES ─────────────────────────────────────────────────────────

[[rules]]
id = "internal-rpc-url"
description = "RPC API keys with providers"
regex = '''(blastapi\.io|gateway\.fm|helius\.xyz|drpc\.org|quicknode\.com).*[0-9a-f]{32,}'''
tags = ["infrastructure"]

[[rules]]
id = "jupiter-api-key"
description = "Jupiter DEX API keys"
regex = '''(jupiter.*api.*key|JUPITER_API_KEY)\s*[:=]\s*[A-Za-z0-9+/]{20,}'''
tags = ["api-key"]

[[rules]]
id = "hyperliquid-api-key"
description = "Hyperliquid API credentials"
regex = '''(hyperliquid.*(?:api.*key|private.*key|secret)|HYPERLIQUID_.*)\s*[:=]\s*[A-Za-z0-9+/]{20,}'''
tags = ["api-key"]

[[rules]]
id = "ethereum-private-key"
description = "Ethereum private keys (64 hex chars)"
regex = '''(?i)(?:private.*key|eth.*key|secret).*[0-9a-f]{64}'''
tags = ["critical"]

[[rules]]
id = "solana-private-key"
description = "Solana private keys (base58, 87-88 chars)"
regex = '''(?i)(?:solana.*key|spl.*key|phantom.*key).*[1-9A-HJ-NP-Za-km-z]{87,88}'''
tags = ["critical"]

# ─── ALLOWLIST ──────────────────────────────────────────────────────────────

[allowlist]
description = "Build artifacts + known false positives"
paths = [
  '''node_modules/''',
  '''package-lock\.json''',
  '''\.git/''',
  '''__pycache__/''',
  '''\.venv/''',
  '''dist/''',
  '''\.next/''',
  '''\.nuxt/''',
  '''\.pytest_cache/''',
  '''\.ruff_cache/''',
  '''\.mypy_cache/''',
  '''vendor/''',
  '''scripts/''',
]
