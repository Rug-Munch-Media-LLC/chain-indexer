# ── Forgejo Actions CI — chain-indexer ────────────────────────
name: CI

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]

jobs:
  # ── Pre-commit mirror (lefthook) ─────────────────────────────
  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install lefthook
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          curl -1sLf 'https://github.com/evilmartians/lefthook/releases/download/v1.7.18/lefthook_1.7.18_linux_amd64.tar.gz' | tar xz -C /usr/local/bin
      - name: Install npm deps
        run: npm ci --no-audit --no-fund
      - name: Run lefthook pre-commit hooks
        run: lefthook run pre-commit 2>/dev/null || echo "Lefthook hooks noted (non-blocking)"
        continue-on-error: true

  # ── Commit check ─────────────────────────────────────────────
  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitlint
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  # ── Lint + typecheck ─────────────────────────────────────────
  lint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          npm ci --no-audit --no-fund
      - name: TypeScript check (blocking)
        run: npx tsc --noEmit
      - name: Check if oxlint config exists
        id: check-oxlint
        run: |
          if [ -f .oxlintrc.json ] || [ -f .oxlintrc.yaml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Oxlint (if config exists)
        if: steps.check-oxlint.outputs.exists == 'true'
        run: npx oxlint@latest --max-warnings=0 src/

  # ── Security ─────────────────────────────────────────────────
  security:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan (blocking)
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin
          gitleaks detect --source . --verbose --config .gitleaks.toml

  # ── Semgrep SAST ─────────────────────────────────────────────
  semgrep:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        run: |
          semgrep --config=auto --error --severity=ERROR \
            --exclude='node_modules/' --exclude='.venv/' \
            .
        continue-on-error: true

  # ── Build check (tsc + Docker) ───────────────────────────────
  build:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          npm ci --no-audit --no-fund
      - name: TypeScript build
        run: npx tsc --noEmit

  # ── Docker build check ───────────────────────────────────────
  docker-build:
    runs-on: docker-x64
    steps:
      - uses: actions/checkout@v4
      - name: Check for Dockerfile
        id: check-dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Build Docker image (if Dockerfile exists)
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: docker build -t chain-indexer:${{ github.sha }} .
      - name: Docker build skipped (no Dockerfile)
        if: steps.check-dockerfile.outputs.exists == 'false'
        run: echo "No Dockerfile found — Docker build check skipped"
