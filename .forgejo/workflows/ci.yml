# ── Forgejo Actions CI — chain-indexer ────────────────────────
# Enhanced 2026-07-27: added commitlint, semgrep, gitleaks config, build check
name: CI

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]

jobs:
  # ── Commit check ─────────────────────────────────────────────
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  # ── Lint + typecheck ─────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Security ─────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin
          gitleaks detect --source . --verbose --config .gitleaks.toml

  # ── Semgrep SAST ─────────────────────────────────────────────
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          auditOn: push
        continue-on-error: true

  # ── Build check ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npx tsc --noEmit
